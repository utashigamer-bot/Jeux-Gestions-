<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Imperium: Nation Builder & Simulation Urbaine</title>
  <style>
    :root {
      --bg-dark: #070b12;
      --panel-bg: rgba(11, 17, 28, 0.94);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(18, 26, 42, 0.92);
      --card-hover: rgba(28, 42, 68, 0.98);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* CANVAS PRINCIPAL PLEIN ÉCRAN */
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      background: #091726;
      touch-action: none;
    }
    #game-canvas:active { cursor: grabbing; }
    #game-canvas.placing-mode { cursor: crosshair !important; }
    #game-canvas.road-mode { cursor: crosshair !important; }

    /* BARRE SUPÉRIEURE HUD (DESKTOP & MOBILE) */
    .top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(98%, 1580px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
      gap: 8px;
    }

    .top-bar-group {
      pointer-events: auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    }

    .nation-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nation-flag-circ {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: #0284c7;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .nation-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .date-badge {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }
    .time-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .time-btn:hover, .time-btn.active {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #041220;
    }

    .resource-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .resource-badge svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .resource-badge .stat-sub {
      font-size: 11px;
      font-weight: 600;
      margin-left: 2px;
    }
    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }

    .btn-hud-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: white;
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-hud-action:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-cyan);
    }
    .btn-hud-action svg {
      width: 14px;
      height: 14px;
    }

    /* BANIÈRES D'ALERTE */
    #blackout-banner {
      position: absolute;
      top: max(75px, calc(env(safe-area-inset-top) + 60px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.95);
      color: white;
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 55;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      animation: pulseAlert 1.2s infinite ease-in-out;
    }
    #epidemic-banner {
      position: absolute;
      top: max(112px, calc(env(safe-area-inset-top) + 95px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245, 158, 11, 0.95);
      color: #041220;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 55;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
    }
    @keyframes pulseAlert {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }

    /* BANDEAU DE PLACEMENT ACTIF */
    #placement-overlay-bar {
      position: absolute;
      top: max(72px, calc(env(safe-area-inset-top) + 55px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--accent-cyan);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 18px;
      border-radius: 24px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 52;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      font-size: 12px;
      max-width: 95vw;
    }
    #placement-overlay-bar .placing-info {
      font-weight: bold;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-cancel-placement {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-cancel-placement:hover {
      background: var(--accent-red);
      color: white;
    }

    /* CONTRÔLES FLOTTANTS DE CARTE (ZOOM & POSITION) */
    .map-controls {
      position: absolute;
      right: 14px;
      top: max(80px, calc(env(safe-area-inset-top) + 65px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 45;
    }
    .map-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: white;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }
    .map-btn:hover, .map-btn:active {
      background: var(--accent-cyan);
      color: #051322;
      border-color: var(--accent-cyan);
    }
    .map-btn svg {
      width: 18px;
      height: 18px;
    }

    /* MINIMAP RADAR */
    #minimap-wrapper {
      position: absolute;
      left: 14px;
      top: max(80px, calc(env(safe-area-inset-top) + 65px));
      width: 150px;
      height: 110px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 40;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.3s;
    }
    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .minimap-lbl {
      position: absolute;
      bottom: 3px;
      left: 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      pointer-events: none;
    }

    /* DOCK DU BAS : ONGLETS ET CATALOGUE DE BÂTIMENTS */
    .bottom-hud-wrapper {
      position: absolute;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(98%, 1440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 50;
      pointer-events: none;
    }

    /* ONGLETS DES CATÉGORIES */
    .category-tabs {
      pointer-events: auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-btn svg {
      width: 14px;
      height: 14px;
    }
    .cat-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.08);
    }
    .cat-btn.active {
      color: #041220;
      background: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
    }

    /* TIROIR DÉFILANT DES BÂTIMENTS */
    .building-tray-scroll {
      pointer-events: auto;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
    }
    .building-tray-scroll::-webkit-scrollbar {
      height: 5px;
    }
    .building-tray-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }

    .bld-card-btn {
      flex: 0 0 auto;
      width: 190px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bld-card-btn:hover, .bld-card-btn:active {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }
    .bld-card-btn.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }
    .bld-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bld-icon-frame {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
      flex-shrink: 0;
    }
    .bld-icon-frame svg {
      width: 18px;
      height: 18px;
    }
    .bld-card-title {
      font-size: 12px;
      font-weight: 800;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bld-card-cost {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-gold);
    }
    .bld-card-desc {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bld-card-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 4px;
      margin-top: 2px;
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* TIROIR D'INSPECTION (DESKTOP ET BOTTOM SHEET MOBILE) */
    #inspector-drawer {
      position: absolute;
      right: 18px;
      bottom: 115px;
      width: 330px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 55;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.75);
      animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideInRight {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .insp-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .insp-title {
      font-size: 15px;
      font-weight: 800;
      color: white;
    }
    .insp-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .insp-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .insp-close:hover { background: rgba(255, 255, 255, 0.2); }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }
    .status-ok {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .status-warn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
    }

    .insp-section-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cost-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .cost-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cost-row span:last-child {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .cost-row.total-row {
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
      padding-top: 5px;
      margin-top: 2px;
      font-weight: bold;
    }

    .insp-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .btn
