<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Imperium: Nation Builder & Simulation Urbaine 3D</title>
  <style>
    :root {
      --bg-dark: #070d18;
      --panel-bg: rgba(11, 19, 34, 0.96);
      --panel-border: rgba(255, 255, 255, 0.14);
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(18, 28, 48, 0.94);
      --card-hover: rgba(28, 44, 76, 0.98);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      background: #091322;
    }
    #game-canvas:active { cursor: grabbing; }
    #game-canvas.tool-mode { cursor: crosshair !important; }

    /* HUD SUPÉRIEUR */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(98%, 1680px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 50;
      gap: 10px;
    }

    .top-bar-group {
      pointer-events: auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    }

    .nation-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nation-crest {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .nation-crest svg { width: 16px; height: 16px; fill: white; }
    .nation-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: white;
    }

    .date-badge {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .time-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: white;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .time-btn:hover, .time-btn.active {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #041220;
    }

    .resource-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .res-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .res-icon svg { width: 15px; height: 15px; fill: currentColor; }
    .stat-sub {
      font-size: 11px;
      font-weight: 600;
      margin-left: 3px;
    }
    .positive { color: var(--accent-green); }
    .negative { color: var(--accent-red); }

    /* RCI */
    .rci-container {
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 14px;
    }
    .rci-lbl {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .rci-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .rci-bar { width: 6px; border-radius: 2px; }
    .rci-bar.r { background: #22c55e; }
    .rci-bar.c { background: #38bdf8; }
    .rci-bar.i { background: #eab308; }

    .btn-hud-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: white;
      border-radius: 18px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-hud-action svg { width: 14px; height: 14px; fill: currentColor; }
    .btn-hud-action:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-cyan);
    }

    /* BANNIÈRE PLACEMENT */
    #placement-overlay-bar {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--accent-cyan);
      backdrop-filter: blur(16px);
      padding: 9px 22px;
      border-radius: 26px;
      display: none;
      align-items: center;
      gap: 16px;
      z-index: 52;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      font-size: 13px;
    }
    .placing-info {
      font-weight: bold;
      color: var(--accent-cyan);
    }
    .btn-cancel-placement {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 4px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-cancel-placement:hover {
      background: var(--accent-red);
      color: white;
    }

    /* NAVIGATION RAPIDE */
    .city-nav-panel {
      position: absolute;
      left: 20px;
      top: 248px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
    }
    .city-nav-btn {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .city-nav-btn:hover {
      background: var(--card-hover);
      color: white;
      border-color: var(--accent-cyan);
    }

    /* MINIMAP RADAR */
    #minimap-wrapper {
      position: absolute;
      left: 20px;
      top: 84px;
      width: 220px;
      height: 150px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 40;
      backdrop-filter: blur(12px);
    }
    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .minimap-lbl {
      position: absolute;
      bottom: 4px;
      left: 8px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      pointer-events: none;
    }

    /* CONTRÔLES ZOOM */
    .map-controls {
      position: absolute;
      right: 20px;
      top: 84px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 40;
    }
    .map-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }
    .map-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .map-btn:hover {
      background: var(--accent-cyan);
      color: #051322;
      border-color: var(--accent-cyan);
    }

    /* BOTTOM DOCK & CATALOGUE */
    .bottom-hud-wrapper {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(98%, 1550px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 50;
      pointer-events: none;
    }

    .category-tabs {
      pointer-events: auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      border-radius: 30px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .cat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .cat-btn svg { width: 14px; height: 14px; fill: currentColor; }
    .cat-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.08);
    }
    .cat-btn.active {
      color: #041220;
      background: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .building-tray-scroll {
      pointer-events: auto;
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      overflow-x: auto;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
    }
    .building-tray-scroll::-webkit-scrollbar { height: 6px; }
    .building-tray-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .bld-card-btn {
      flex: 0 0 auto;
      width: 220px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .bld-card-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .bld-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bld-icon-frame {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-cyan);
    }
    .bld-icon-frame svg { width: 18px; height: 18px; fill: currentColor; }
    .bld-card-title {
      font-size: 13px;
      font-weight: 800;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bld-card-cost {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-gold);
    }
    .bld-card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #toast-notice {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--accent-cyan);
      color: white;
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 80;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>

  <!-- CANVAS DU MOTEUR -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD SUPÉRIEUR -->
  <header class="top-bar">
    <div class="top-bar-group">
      <div class="nation-badge">
        <div class="nation-crest">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div>
          <div class="nation-title" id="top-nation-name">République d'Aléria</div>
          <div class="date-badge" id="game-date">1 Janvier 2026</div>
        </div>
      </div>
      <div style="display: flex; gap: 4px; margin-left: 6px;">
        <button class="time-btn" data-speed="0">PAUSE</button>
        <button class="time-btn active" data-speed="1">1X</button>
        <button class="time-btn" data-speed="2">2X</button>
        <button class="time-btn" data-speed="5">5X</button>
      </div>
    </div>

    <div class="top-bar-group">
      <!-- Trésor -->
      <div class="resource-badge">
        <div class="res-icon" style="color: var(--accent-gold);">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
        </div>
        <div>
          <span id="stat-money">$1,600.0K</span>
          <span class="stat-sub positive" id="stat-income">+$4.2K/s</span>
        </div>
      </div>

      <!-- Population -->
      <div class="resource-badge" style="border-left: 1px solid rgba(255,255,255,0.12); padding-left: 14px;">
        <div class="res-icon" style="color: var(--accent-cyan);">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <div>
          <span id="stat-pop">21.8K</span>
          <span class="stat-sub positive" id="stat-jobs">98% emploi</span>
        </div>
      </div>

      <!-- Énergie -->
      <div class="resource-badge" style="border-left: 1px solid rgba(255,255,255,0.12); padding-left: 14px;">
        <div class="res-icon" style="color: #38bdf8;">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>
        <div>
          <span id="stat-energy">210 / 520 MW</span>
          <span class="stat-sub positive" id="stat-energy-balance">+310 MW</span>
        </div>
      </div>

      <!-- Demande RCI -->
      <div class="rci-container">
        <span class="rci-lbl">RCI</span>
        <div class="rci-bars" title="Demande : Vert (Résidentiel), Bleu (Commercial), Jaune (Industriel)">
          <div class="rci-bar r" id="rci-r" style="height: 18px;"></div>
          <div class="rci-bar c" id="rci-c" style="height: 14px;"></div>
          <div class="rci-bar i" id="rci-i" style="height: 10px;"></div>
        </div>
      </div>
    </div>

    <div class="top-bar-group">
      <button class="btn-hud-action" id="btn-save-game">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        <span>Sauvegarder</span>
      </button>
      <button class="btn-hud-action" id="sound-btn">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
    </div>
  </header>

  <!-- BANNIÈRE DE PLACEMENT ACTIF -->
  <div id="placement-overlay-bar">
    <div class="placing-info" id="placing-title">Mode Placement</div>
    <span style="color: var(--text-muted); font-size: 12px;" id="placing-instruction">
      Cliquez sur une parcelle déverrouillée ou sur une voie pour vous y raccorder.
    </span>
    <button class="btn-cancel-placement" id="btn-cancel-placement">Annuler [Échap]</button>
  </div>

  <!-- NAVIGATION RAPIDE -->
  <div class="city-nav-panel">
    <div style="font-size: 10px; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 2px;">Métropoles</div>
    <button class="city-nav-btn" data-x="4800" data-y="5200">Port-Solaire (Capitale)</button>
    <button class="city-nav-btn" data-x="11600" data-y="5400">Val-des-Forges (Industrie)</button>
    <button class="city-nav-btn" data-x="7800" data-y="2100">Massif des Crêtes Noires</button>
  </div>

  <!-- MINIMAP SATELLITE -->
  <div id="minimap-wrapper">
    <canvas id="minimap-canvas" width="220" height="150"></canvas>
    <div class="minimap-lbl">Topographie Nationale</div>
  </div>

  <!-- CONTRÔLES ZOOM -->
  <div class="map-controls">
    <button class="map-btn" id="btn-zoom-in" title="Zoomer">+</button>
    <button class="map-btn" id="btn-zoom-out" title="Dézoomer">−</button>
    <button class="map-btn" id="btn-macro-view" title="Vue d'ensemble">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </button>
  </div>

  <!-- BOTTOM DOCK & CATALOGUE -->
  <div class="bottom-hud-wrapper">
    <nav class="category-tabs">
      <button class="cat-btn active" data-cat="infrastructure">
        <svg viewBox="0 0 24 24"><path d="M18 4H6v2l6.5 6L6 18v2h12v-2l-6.5-6L18 6V4z"/></svg>
        <span>Autoroutes & Voies Larges</span>
      </button>
      <button class="cat-btn" data-cat="residential">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Habitations 3D</span>
      </button>
      <button class="cat-btn" data-cat="business">
        <svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
        <span>Affaires & Tours</span>
      </button>
      <button class="cat-btn" data-cat="industry">
        <svg viewBox="0 0 24 24"><path d="M22 22H2V10l7-3v4l7-3v4l6-3v10z"/></svg>
        <span>Industrie & Fret</span>
      </button>
      <button class="cat-btn" data-cat="energy">
        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        <span>Énergie Propre</span>
      </button>
    </nav>
    <div class="building-tray-scroll" id="building-tray"></div>
  </div>

  <!-- TOAST -->
  <div id="toast-notice">Notice</div>

  <!-- ==========================================================================
       MOTEUR JAVASCRIPT DU JEU (Reliefs Anguleux, Parcelles Achetables & 3D)
       ========================================================================== -->
  <script>
    /* SYNTHÉTISEUR AUDIO */
    class SoundEngine {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
      }
      play(freq, type = "sine", dur = 0.08) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

    /* MOTEUR DE CAMÉRA FLUIDE */
    class CameraEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.x = 4800;
        this.y = 5100;
        this.targetX = 4800;
        this.targetY = 5100;
        this.scale = 0.85;
        this.targetScale = 0.85;
        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartY = 0;
        this.keys = {};

        this.init();
      }

      init() {
        this.resize();
        window.addEventListener("resize", () => this.resize());

        window.addEventListener("mousedown", (e) => {
          if (e.target !== this.canvas) return;
          if (e.button === 0 && !GameState.activeTool) {
            this.isDragging = true;
            this.dragStartX = e.clientX;
            this.dragStartY = e.clientY;
          } else if (e.button === 2) {
            cancelCurrentTool();
          }
        });

        window.addEventListener("contextmenu", (e) => {
          if (e.target === this.canvas) e.preventDefault();
        });

        window.addEventListener("mousemove", (e) => {
          if (this.isDragging) {
            const dx = (e.clientX - this.dragStartX) / this.scale;
            const dy = (e.clientY - this.dragStartY) / this.scale;
            this.targetX -= dx;
            this.targetY -= dy;
            this.dragStartX = e.clientX;
            this.dragStartY = e.clientY;
          }
        });

        window.addEventListener("mouseup", (e) => {
          if (e.button === 0) this.isDragging = false;
        });

        window.addEventListener("wheel", (e) => {
          if (e.target !== this.canvas) return;
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.22 : 0.82;
          this.setZoom(this.targetScale * factor, e.clientX, e.clientY);
        }, { passive: false });

        window.addEventListener("keydown", (e) => {
          if (e.target.tagName === "INPUT") return;
          this.keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener("keyup", (e) => {
          this.keys[e.key.toLowerCase()] = false;
        });
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      setZoom(val, sx = this.canvas.width / 2, sy = this.canvas.height / 2) {
        const clamped = Math.max(0.06, Math.min(2.8, val));
        const wBefore = this.screenToWorld(sx, sy);
        this.targetScale = clamped;
        this.scale = clamped;
        const wAfter = this.screenToWorld(sx, sy);
        this.targetX += (wBefore.x - wAfter.x);
        this.targetY += (wBefore.y - wAfter.y);
      }

      screenToWorld(sx, sy) {
        return {
          x: (sx - this.canvas.width / 2) / this.scale + this.x,
          y: (sy - this.canvas.height / 2) / this.scale + this.y
        };
      }

      update() {
        const spd = 26 / this.scale;
        if (this.keys["z"] || this.keys["w"] || this.keys["arrowup"]) this.targetY -= spd;
        if (this.keys["s"] || this.keys["arrowdown"]) this.targetY += spd;
        if (this.keys["q"] || this.keys["a"] || this.keys["arrowleft"]) this.targetX -= spd;
        if (this.keys["d"] || this.keys["arrowright"]) this.targetX += spd;

        this.x += (this.targetX - this.x) * 0.18;
        this.y += (this.targetY - this.y) * 0.18;
        this.scale += (this.targetScale - this.scale) * 0.18;

        this.targetX = Math.max(0, Math.min(WORLD_WIDTH, this.targetX));
        this.targetY = Math.max(0, Math.min(WORLD_HEIGHT, this.targetY));
      }
    }

    let camera = null;

    /* RACCORDEMENT ET BIFURCATION EN PLEIN MILIEU D'UNE ROUTE */
    function getClosestPointOnSegment(p, a, b) {
      const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
      if (l2 === 0) return { x: a.x, y: a.y, t: 0, dist: Math.hypot(p.x - a.x, p.y - a.y) };
      let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = a.x + t * (b.x - a.x);
      const projY = a.y + t * (b.y - a.y);
      return { x: projX, y: projY, t: t, dist: Math.hypot(p.x - projX, p.y - projY) };
    }

    /* ==========================================================================
       RENDU DU RELIEF ACÉRÉ & FACETTES ALPINES (FINI LES FORMES RONDES)
       ========================================================================== */
    function drawJaggedMountains(ctx) {
      JAGGED_MOUNTAIN_MASSIFS.forEach(m => {
        // 1. Terrasses et contours polygonaux rocheux (socle géologique)
        m.contours.forEach((poly, idx) => {
          ctx.fillStyle = idx === 0 ? "#223528" : "#2f4034";
          ctx.beginPath();
          poly.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

        // 2. Pics alpins acérés avec facettes brisées (3D volumétrique rocheuse)
        m.peaks.forEach(p => {
          // Face Nord-Ouest éclairée (roche granitique claire)
          ctx.fillStyle = "#5d6d7e";
          ctx.beginPath();
          ctx.moveTo(p.peakX, p.peakY);
          ctx.lineTo(p.leftBase.x, p.leftBase.y);
          ctx.lineTo(p.midBase.x, p.midBase.y);
          ctx.closePath();
          ctx.fill();

          // Face Sud-Est ombragée (basalte sombre en ombre profonde)
          ctx.fillStyle = "#2c3e50";
          ctx.beginPath();
          ctx.moveTo(p.peakX, p.peakY);
          ctx.lineTo(p.midBase.x, p.midBase.y);
          ctx.lineTo(p.rightBase.x, p.rightBase.y);
          ctx.closePath();
          ctx.fill();

          // Arête centrale tranchante
          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(p.peakX, p.peakY);
          ctx.lineTo(p.midBase.x, p.midBase.y);
          ctx.stroke();

          // Neiges éternelles en zigzag acéré sur le sommet
          if (p.snow) {
            const sh = (p.midBase.y - p.peakY) * 0.45;
            ctx.fillStyle = "#f8fafc";
            ctx.beginPath();
            ctx.moveTo(p.peakX, p.peakY);
            ctx.lineTo(p.peakX - 90, p.peakY + sh * 0.9);
            ctx.lineTo(p.peakX - 35, p.peakY + sh * 0.7);
            ctx.lineTo(p.peakX, p.peakY + sh * 1.05);
            ctx.lineTo(p.peakX + 45, p.peakY + sh * 0.8);
            ctx.lineTo(p.peakX + 110, p.peakY + sh * 0.95);
            ctx.closePath();
            ctx.fill();

            // Ombre sur la neige du versant est
            ctx.fillStyle = "rgba(203, 213, 225, 0.6)";
            ctx.beginPath();
            ctx.moveTo(p.peakX, p.peakY);
            ctx.lineTo(p.peakX, p.peakY + sh * 1.05);
            ctx.lineTo(p.peakX + 110, p.peakY + sh * 0.95);
            ctx.closePath();
            ctx.fill();
          }
        });
      });
    }

    /* ==========================================================================
       DESSIN DES GRANDES AUTOROUTES ÉLARGIES (52 PX) ET RUES (32 PX)
       ========================================================================== */
    function drawRoadsAndTraffic(ctx) {
      if (ROAD_SEGMENTS.length === 0) return;

      // 1. Fondations bitumineuses larges
      ROAD_SEGMENTS.forEach(seg => {
        const nA = ROAD_NODES.find(n => n.id === seg.from);
        const nB = ROAD_NODES.find(n => n.id === seg.to);
        if (!nA || !nB) return;

        const isHwy = seg.type === "highway";
        ctx.lineWidth = isHwy ? 54 : 32;
        ctx.strokeStyle = isHwy ? "#141c26" : "#202a36";
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(nA.x, nA.y);
        ctx.lineTo(nB.x, nB.y);
        ctx.stroke();
      });

      // 2. Chaussée de roulement
      ROAD_SEGMENTS.forEach(seg => {
        const nA = ROAD_NODES.find(n => n.id === seg.from);
        const nB = ROAD_NODES.find(n => n.id === seg.to);
        if (!nA || !nB) return;

        const isHwy = seg.type === "highway";
        ctx.lineWidth = isHwy ? 46 : 22;
        ctx.strokeStyle = isHwy ? "#293240" : "#343f4e";
        ctx.beginPath();
        ctx.moveTo(nA.x, nA.y);
        ctx.lineTo(nB.x, nB.y);
        ctx.stroke();
      });

      // 3. Marquages au sol spécifiques
      ROAD_SEGMENTS.forEach(seg => {
        const nA = ROAD_NODES.find(n => n.id === seg.from);
        const nB = ROAD_NODES.find(n => n.id === seg.to);
        if (!nA || !nB) return;

        if (seg.type === "highway") {
          // Glissière centrale métallique surélevée
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#cbd5e1";
          ctx.beginPath();
          ctx.moveTo(nA.x, nA.y);
          ctx.lineTo(nB.x, nB.y);
          ctx.stroke();

          // Lignes continues des bandes d'arrêt d'urgence
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "#f8fafc";
          ctx.stroke();
        } else {
          // Ligne discontinue médiane urbaine
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = "#f8fafc";
          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(nA.x, nA.y);
          ctx.lineTo(nB.x, nB.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });

      // 4. Carrefours
      ROAD_NODES.forEach(n => {
        ctx.fillStyle = "#293240";
        ctx.beginPath();
        ctx.arc(n.x, n.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Véhicules en circulation fluide
      VEHICLES.forEach(v => {
        const nA = ROAD_NODES.find(n => n.id === v.segment.from);
        const nB = ROAD_NODES.find(n => n.id === v.segment.to);
        if (!nA || !nB) return;

        const vx = nA.x + (nB.x - nA.x) * v.progress;
        const vy = nA.y + (nB.y - nA.y) * v.progress;
        const angle = Math.atan2(nB.y - nA.y, nB.x - nA.x) + (v.dir < 0 ? Math.PI : 0);

        ctx.save();
        ctx.translate(vx, vy);
        ctx.rotate(angle);

        // Faisceau de phares
        ctx.fillStyle = "rgba(254, 240, 138, 0.4)";
        ctx.beginPath();
        ctx.moveTo(10, -4);
        ctx.lineTo(38, -14);
        ctx.lineTo(38, 14);
        ctx.lineTo(10, 4);
        ctx.closePath();
        ctx.fill();

        if (v.type === "truck") {
          ctx.fillStyle = "#0284c7";
          ctx.fillRect(-18, -7, 36, 14);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(-16, -6, 22, 12);
        } else {
          ctx.fillStyle = v.color;
          ctx.fillRect(-10, -6, 20, 12);
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(0, -5, 5, 10);
        }
        ctx.restore();
      });
    }

    /* ==========================================================================
       DESSIN DES PARCELLES DÉVERROUILLABLES & BÂTIMENTS 3D
       ========================================================================== */
    function drawUrbanBlocksAndParcels(ctx, time) {
      URBAN_BLOCKS.forEach(b => {
        // Enceinte générale du bloc
        ctx.fillStyle = "#15202e";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = "#334458";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // Dessin de chaque parcelle
        b.parcels.forEach(p => {
          const px = b.x + p.relX;
          const py = b.y + p.relY;

          if (!p.unlocked) {
            // Parcelle verrouillée à l'achat
            ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
            ctx.fillRect(px, py, p.w, p.h);

            // Cadre en pointillés dorés
            ctx.strokeStyle = "rgba(245, 158, 11, 0.65)";
            ctx.lineWidth = 1.8;
            ctx.setLineDash([6, 6]);
            ctx.strokeRect(px, py, p.w, p.h);
            ctx.setLineDash([]);

            // Badge d'achat foncier
            ctx.fillStyle = "rgba(10, 16, 28, 0.9)";
            ctx.beginPath();
            ctx.roundRect(px + 8, py + p.h / 2 - 12, p.w - 16, 24, 6);
            ctx.fill();
            ctx.strokeStyle = "var(--accent-gold)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.fillStyle = "#f59e0b";
            ctx.font = "bold 10px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`ACHETER : $${(p.unlockCost / 1000).toFixed(0)}K`, px + p.w / 2, py + p.h / 2 + 4);
          } else {
            // Parcelle viabilisée et prête à bâtir
            ctx.fillStyle = p.building ? "#1f2c3d" : "rgba(56, 189, 248, 0.08)";
            ctx.fillRect(px, py, p.w, p.h);
            ctx.strokeStyle = p.building ? "#38bdf8" : "rgba(56, 189, 248, 0.4)";
            ctx.lineWidth = 1.2;
            ctx.strokeRect(px, py, p.w, p.h);

            // Bâtiment 3D encastré avec précision géométrique
            if (p.building) {
              drawBuilding3DInParcel(ctx, px, py, p.w, p.h, p.building.type, time);
            }
          }
        });
      });
    }

    /* RENDU VOLUMÉTRIQUE 3D DES ÉDIFICES */
    function drawBuilding3DInParcel(ctx, px, py, pw, ph, type, time) {
      const cx = px + pw / 2;
      const cy = py + ph / 2;

      // 1. Allée pavée menant à la rue
      ctx.fillStyle = "#3b4859";
      ctx.fillRect(cx - 7, cy + 14, 14, ph / 2 - 14);

      // 2. Ombre portée 3D inclinée au sol
      ctx.fillStyle = "rgba(6, 12, 22, 0.45)";
      ctx.beginPath();
      ctx.moveTo(cx - pw * 0.35, cy + ph * 0.25);
      ctx.lineTo(cx + pw * 0.35, cy + ph * 0.25);
      ctx.lineTo(cx + pw * 0.48, cy + ph * 0.42);
      ctx.lineTo(cx - pw * 0.22, cy + ph * 0.42);
      ctx.closePath();
      ctx.fill();

      // 3. Volumétrie architecturale
      if (type === "house") {
        const bw = pw * 0.56;
        const bh = ph * 0.42;

        // Corps de bâtiment
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);

        // Façade ombragée à droite
        ctx.fillStyle = "#94a3b8";
        ctx.fillRect(cx + bw / 2 - 6, cy - bh / 2, 6, bh);

        // Toit à double pan tuilé
        ctx.fillStyle = "#b91c1c";
        ctx.beginPath();
        ctx.moveTo(cx - bw / 2 - 4, cy - bh / 2);
        ctx.lineTo(cx, cy - bh / 2 - 18);
        ctx.lineTo(cx + bw / 2 + 4, cy - bh / 2);
        ctx.closePath();
        ctx.fill();

        // Fenêtres illuminées
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(cx - bw * 0.35, cy - 3, 8, 8);
        ctx.fillRect(cx + bw * 0.12, cy - 3, 8, 8);
        ctx.fillStyle = "#78350f";
        ctx.fillRect(cx - 3, cy + 3, 7, 13);
      } else if (type === "villa") {
        const bw = pw * 0.65;
        const bh = ph * 0.45;

        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);

        // Baie vitrée réfléchissante
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(cx - bw * 0.4, cy - bh * 0.28, bw * 0.8, 14);

        // Piscine dans le jardin
        ctx.fillStyle = "#0284c7";
        ctx.fillRect(cx - bw * 0.42, cy + 8, 20, 12);
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - bw * 0.42, cy + 8, 20, 12);
      } else if (type === "apartment") {
        const bw = pw * 0.72;
        const bh = ph * 0.58;

        // Façade en pierre de taille haussmannienne
        ctx.fillStyle = "#cbd5e1";
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);

        // Ombre latérale droite
        ctx.fillStyle = "#64748b";
        ctx.fillRect(cx + bw / 2 - 8, cy - bh / 2, 8, bh);

        // Toit mansardé zinc
        ctx.fillStyle = "#475569";
        ctx.fillRect(cx - bw / 2 + 2, cy - bh / 2 - 14, bw - 4, 14);

        // Rangées de fenêtres avec balcons
        ctx.fillStyle = "#0f172a";
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            ctx.fillRect(cx - bw * 0.36 + c * (bw * 0.28), cy - bh * 0.36 + r * 16, 7, 9);
          }
        }
      } else if (type === "office_tower") {
        const bw = pw * 0.58;
        const bh = ph * 0.75;

        // Gratte-ciel en verre
        const grad = ctx.createLinearGradient(cx - bw / 2, cy - bh / 2, cx + bw / 2, cy + bh / 2);
        grad.addColorStop(0, "#38bdf8");
        grad.addColorStop(0.5, "#0284c7");
        grad.addColorStop(1, "#0f172a");
        ctx.fillStyle = grad;
        ctx.fillRect(cx - bw / 2, cy - bh / 2 - 16, bw, bh + 16);

        // Machinerie et Héliport de toit
        ctx.fillStyle = "#334155";
        ctx.fillRect(cx - bw * 0.3, cy - bh / 2 - 24, bw * 0.6, 8);

        // Trame de fenêtres vitrées
        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 3; c++) {
            ctx.fillRect(cx - bw * 0.34 + c * (bw * 0.28), cy - bh * 0.44 + r * 16, 7, 9);
          }
        }
      } else if (type === "city_hall") {
        const bw = pw * 0.74;
        const bh = ph * 0.54;

        ctx.fillStyle = "#f1f5f9";
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);

        // Dôme central en cuivre
        ctx.fillStyle = "#0d9488";
        ctx.beginPath();
        ctx.arc(cx, cy - bh / 2, 18, Math.PI, 0);
        ctx.fill();

        // Mât et drapeau
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy - bh / 2 - 18);
        ctx.lineTo(cx, cy - bh / 2 - 34);
        ctx.stroke();
        ctx.fillStyle = "#00b4d8";
        ctx.fillRect(cx, cy - bh / 2 - 34, 12, 7);
      } else if (type === "factory") {
        const bw = pw * 0.76;
        const bh = ph * 0.52;

        ctx.fillStyle = "#334155";
        ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);

        // Cheminées d'échappement
        ctx.fillStyle = "#b91c1c";
        ctx.fillRect(cx - bw * 0.32, cy - bh / 2 - 26, 9, 26);
        ctx.fillRect(cx + bw * 0.18, cy - bh / 2 - 20, 8, 20);

        // Puffs de fumée animée
        ctx.fillStyle = "rgba(226, 232, 240, 0.45)";
        for (let p = 0; p < 3; p++) {
          const off = ((time * 0.05 + p * 18) % 45);
          ctx.beginPath();
          ctx.arc(cx - bw * 0.32 + 4 + Math.sin(off * 0.1) * 5, cy - bh / 2 - 28 - off, 3 + off * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    /* ==========================================================================
       BOUCLE PRINCIPALE DE RENDU
       ========================================================================== */
    function renderGameWorld(time) {
      const canvas = camera.canvas;
      const ctx = camera.ctx;
      camera.update();

      // Mise à jour véhicules
      VEHICLES.forEach(v => {
        v.progress += v.speed * v.dir * GameState.speed;
        if (v.progress >= 1 || v.progress <= 0) v.dir *= -1;
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(camera.scale, camera.scale);
      ctx.translate(-camera.x, -camera.y);

      // 1. Océan Profond
      ctx.fillStyle = "#08111d";
      ctx.fillRect(-4000, -4000, WORLD_WIDTH + 8000, WORLD_HEIGHT + 8000);

      // 2. Territoire National Continu
      ctx.beginPath();
      NATION_TERRITORY.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      });
      ctx.closePath();
      ctx.fillStyle = "#19281e";
      ctx.fill();
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3 / camera.scale;
      ctx.stroke();

      // 3. Montagnes acérées et crêtes rocheuses 3D
      drawJaggedMountains(ctx);

      // 4. Fleuve navigable dans la vallée
      ctx.beginPath();
      RIVER_PATH.forEach((pt, i) => {
        if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      });
      ctx.strokeStyle = "#1d4ed8";
      ctx.lineWidth = 110;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 80;
      ctx.stroke();

      // 5. Blocs urbains, parcelles achetables et bâtiments 3D
      drawUrbanBlocksAndParcels(ctx, time);

      // 6. Autoroutes et rues élargies
      drawRoadsAndTraffic(ctx);

      // 7. Aperçu outil actif
      if (GameState.activeTool) {
        const mouseWorld = camera.screenToWorld(currentMouseX, currentMouseY);

        if (GameState.activeTool.isRoad) {
          let snapPt = null;
          const closeN = ROAD_NODES.find(n => Math.hypot(n.x - mouseWorld.x, n.y - mouseWorld.y) < 32);

          if (closeN) {
            snapPt = { x: closeN.x, y: closeN.y };
          } else {
            for (let seg of ROAD_SEGMENTS) {
              const nA = ROAD_NODES.find(n => n.id === seg.from);
              const nB = ROAD_NODES.find(n => n.id === seg.to);
              if (nA && nB) {
                const proj = getClosestPointOnSegment(mouseWorld, nA, nB);
                if (proj.dist < 28) {
                  snapPt = { x: proj.x, y: proj.y };
                  break;
                }
              }
            }
          }

          const target = snapPt || mouseWorld;

          if (GameState.roadStartNode) {
            ctx.lineWidth = GameState.activeTool.roadType === "highway" ? 46 : 22;
            ctx.strokeStyle = "rgba(56, 189, 248, 0.7)";
            ctx.beginPath();
            ctx.moveTo(GameState.roadStartNode.x, GameState.roadStartNode.y);
            ctx.lineTo(target.x, target.y);
            ctx.stroke();
          }

          ctx.fillStyle = snapPt ? "#10b981" : "rgba(56, 189, 248, 0.8)";
          ctx.beginPath();
          ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();

      renderMinimap();
      requestAnimationFrame(renderGameWorld);
    }

    /* MINIMAP RADAR */
    function renderMinimap() {
      const mCanvas = document.getElementById("minimap-canvas");
      const mctx = mCanvas.getContext("2d");
      mctx.clearRect(0, 0, mCanvas.width, mCanvas.height);
      mctx.fillStyle = "#08111d";
      mctx.fillRect(0, 0, mCanvas.width, mCanvas.height);

      const sx = mCanvas.width / WORLD_WIDTH;
      const sy = mCanvas.height / WORLD_HEIGHT;

      mctx.beginPath();
      NATION_TERRITORY.forEach((pt, i) => {
        const px = pt.x * sx, py = pt.y * sy;
        if (i === 0) mctx.moveTo(px, py); else mctx.lineTo(px, py);
      });
      mctx.closePath();
      mctx.fillStyle = "#1e3327";
      mctx.fill();

      // Reliefs sur la minimap
      JAGGED_MOUNTAIN_MASSIFS.forEach(m => {
        m.peaks.forEach(p => {
          mctx.fillStyle = "#4a5568";
          mctx.beginPath();
          mctx.moveTo(p.peakX * sx, p.peakY * sy);
          mctx.lineTo(p.leftBase.x * sx, p.leftBase.y * sy);
          mctx.lineTo(p.rightBase.x * sx, p.rightBase.y * sy);
          mctx.closePath();
          mctx.fill();
        });
      });

      const halfW = (camera.canvas.width / 2) / camera.scale;
      const halfH = (camera.canvas.height / 2) / camera.scale;
      mctx.strokeStyle = "#38bdf8";
      mctx.lineWidth = 1.5;
      mctx.strokeRect((camera.x - halfW) * sx, (camera.y - halfH) * sy, halfW * 2 * sx, halfH * 2 * sy);
    }

    /* GESTION DU CLIC : ACHAT DE PARCELLES OU PLACEMENT */
    let currentMouseX = 0, currentMouseY = 0;
    window.addEventListener("mousemove", (e) => {
      currentMouseX = e.clientX;
      currentMouseY = e.clientY;
    });

    function handleCanvasClick(e) {
      const worldPos = camera.screenToWorld(e.clientX, e.clientY);

      // 1. Clic sur une parcelle sans outil actif : ACHAT DE PARCELLE
      if (!GameState.activeTool) {
        for (let b of URBAN_BLOCKS) {
          for (let p of b.parcels) {
            const px = b.x + p.relX;
            const py = b.y + p.relY;

            if (worldPos.x >= px && worldPos.x <= px + p.w && worldPos.y >= py && worldPos.y <= py + p.h) {
              if (!p.unlocked) {
                if (GameState.money < p.unlockCost) {
                  showToast(`Fonds insuffisants ! ($${p.unlockCost.toLocaleString()} requis pour ce terrain)`);
                  audio.alert();
                  return;
                }
                // Achat du terrain
                GameState.money -= p.unlockCost;
                p.unlocked = true;
                audio.unlock();
                showToast(`Terrain acquis et viabilisé avec succès ! ($${p.unlockCost.toLocaleString()})`);
                updateHud();
                return;
              }
            }
          }
        }
        return;
      }

      e.stopPropagation();
      const tool = GameState.activeTool;

      // 2. Outil Voirie
      if (tool.isRoad) {
        if (GameState.money < tool.cost) {
          showToast("Fonds insuffisants !");
          audio.alert();
          return;
        }

        let clickedN = ROAD_NODES.find(n => Math.hypot(n.x - worldPos.x, n.y - worldPos.y) < 30);

        if (!clickedN) {
          for (let i = 0; i < ROAD_SEGMENTS.length; i++) {
            const seg = ROAD_SEGMENTS[i];
            const nA = ROAD_NODES.find(n => n.id === seg.from);
            const nB = ROAD_NODES.find(n => n.id === seg.to);
            if (nA && nB) {
              const proj = getClosestPointOnSegment(worldPos, nA, nB);
              if (proj.dist < 28) {
                clickedN = { id: "n_" + Date.now(), x: Math.round(proj.x), y: Math.round(proj.y) };
                ROAD_NODES.push(clickedN);

                ROAD_SEGMENTS.splice(i, 1);
                ROAD_SEGMENTS.push({ id: "s_" + Date.now() + "_1", from: nA.id, to: clickedN.id, type: seg.type });
                ROAD_SEGMENTS.push({ id: "s_" + Date.now() + "_2", from: clickedN.id, to: nB.id, type: seg.type });
                showToast("Bifurcation insérée sur la voie existante !");
                break;
              }
            }
          }

          if (!clickedN) {
            clickedN = { id: "n_" + Date.now(), x: Math.round(worldPos.x), y: Math.round(worldPos.y) };
            ROAD_NODES.push(clickedN);
          }
        }

        if (!GameState.roadStartNode) {
          GameState.roadStartNode = clickedN;
          showToast("Départ fixé. Cliquez pour prolonger la voie.");
          audio.click();
        } else {
          if (GameState.roadStartNode !== clickedN) {
            GameState.money -= tool.cost;
            const newSeg = { id: "s_" + Date.now(), from: GameState.roadStartNode.id, to: clickedN.id, type: tool.roadType };
            ROAD_SEGMENTS.push(newSeg);

            VEHICLES.push({
              segment: newSeg,
              progress: 0.1,
              speed: tool.roadType === "highway" ? 0.008 : 0.004,
              dir: 1,
              type: tool.roadType === "highway" ? "truck" : "car",
              color: "#38bdf8"
            });

            audio.build();
            showToast("Tronçon autoroutier raccordé !");
            GameState.roadStartNode = clickedN;
            updateHud();
          }
        }
        return;
      }

      // 3. Placement d'un bâtiment dans une parcelle déverrouillée
      for (let b of URBAN_BLOCKS) {
        for (let p of b.parcels) {
          const px = b.x + p.relX;
          const py = b.y + p.relY;

          if (worldPos.x >= px && worldPos.x <= px + p.w && worldPos.y >= py && worldPos.y <= py + p.h) {
            if (!p.unlocked) {
              showToast("Cette parcelle est verrouillée ! Cliquez dessus d'abord pour l'acheter.");
              audio.alert();
              return;
            }
            if (p.building) {
              showToast("Cette parcelle est déjà occupée !");
              audio.alert();
              return;
            }
            if (GameState.money < tool.cost) {
              showToast("Fonds insuffisants !");
              audio.alert();
              return;
            }

            GameState.money -= tool.cost;
            p.building = { type: tool.type, name: tool.name, level: 1 };
            audio.build();
            showToast(`${tool.name} encastré dans la parcelle avec succès !`);
            cancelCurrentTool();
            updateHud();
            return;
          }
        }
      }

      showToast("Veuillez cliquer dans une parcelle déverrouillée !");
    }

    function selectCategory(catKey) {
      GameState.activeCategory = catKey;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      const btn = document.querySelector(`.cat-btn[data-cat="${catKey}"]`);
      if (btn) btn.classList.add("active");

      const tray = document.getElementById("building-tray");
      tray.innerHTML = "";

      const items = CATALOG[catKey] || [];
      items.forEach(item => {
        const card = document.createElement("button");
        card.className = "bld-card-btn";
        card.innerHTML = `
          <div class="bld-card-top">
            <div class="bld-icon-frame"><svg viewBox="0 0 24 24">${item.iconSvg}</svg></div>
            <div style="overflow: hidden;">
              <div class="bld-card-title">${item.name}</div>
              <div class="bld-card-cost">$${item.cost.toLocaleString()}</div>
            </div>
          </div>
          <div class="bld-card-desc">${item.desc}</div>
        `;
        card.addEventListener("click", () => startTool(item));
        tray.appendChild(card);
      });
      audio.click();
    }

    function startTool(item) {
      GameState.activeTool = item;
      GameState.roadStartNode = null;
      document.getElementById("game-canvas").className = "tool-mode";
      document.getElementById("placement-overlay-bar").style.display = "flex";
      document.getElementById("placing-title").textContent = `${item.name} ($${item.cost.toLocaleString()})`;
      audio.click();
    }

    function cancelCurrentTool() {
      GameState.activeTool = null;
      GameState.roadStartNode = null;
      document.getElementById("game-canvas").className = "";
      document.getElementById("placement-overlay-bar").style.display = "none";
    }

    function simulationTick() {
      if (GameState.speed === 0) return;

      let rev = 0;
      let exp = 100;
      let energyProd = 0;
      let energyDemand = Math.round(GameState.totalPop / 1000) * 8;

      URBAN_BLOCKS.forEach(b => {
        b.parcels.forEach(p => {
          if (!p.building) return;
          const item = Object.values(CATALOG).flat().find(c => c.type === p.building.type);
          if (!item) return;

          if (item.energyProd) energyProd += item.energyProd;
          if (item.energy && item.energy < 0) energyDemand += Math.abs(item.energy);
          if (item.profit) rev += Math.round(item.profit * 0.22);
          exp += 15;
        });
      });

      rev += Math.round(GameState.totalPop * 0.05 * GameState.taxIncome);
      const net = (rev - exp) * GameState.speed;
      GameState.money += net;
      GameState.totalEnergyProd = energyProd;
      GameState.totalEnergyDemand = energyDemand;

      if (energyProd >= energyDemand) {
        GameState.totalPop += Math.round(25 * GameState.speed);
      }

      GameState.gameDays += GameState.speed;
      const d = new Date(2026, 0, 1 + GameState.gameDays);
      const months = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
      document.getElementById("game-date").textContent = `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;

      updateHud(net);
    }

    function updateHud(netIncome = 0) {
      document.getElementById("stat-money").textContent = "$" + (GameState.money / 1000).toFixed(1) + "K";
      document.getElementById("stat-income").textContent = (netIncome >= 0 ? "+" : "") + "$" + (netIncome / 1000).toFixed(1) + "K/s";
      document.getElementById("stat-income").className = "stat-sub " + (netIncome >= 0 ? "positive" : "negative");

      document.getElementById("stat-pop").textContent = (GameState.totalPop / 1000).toFixed(1) + "K";
      document.getElementById("stat-energy").textContent = `${GameState.totalEnergyDemand} / ${GameState.totalEnergyProd} MW`;
      const diff = GameState.totalEnergyProd - GameState.totalEnergyDemand;
      document.getElementById("stat-energy-balance").textContent = (diff >= 0 ? "+" : "") + `${diff} MW`;
    }

    function showToast(msg) {
      const toast = document.getElementById("toast-notice");
      toast.textContent = msg;
      toast.style.display = "flex";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function saveGame() {
      const data = {
        money: GameState.money,
        pop: GameState.totalPop,
        roads: ROAD_SEGMENTS,
        nodes: ROAD_NODES,
        blocks: URBAN_BLOCKS
      };
      localStorage.setItem("imperium_v4_3d", JSON.stringify(data));
      showToast("Partie sauvegardée dans le navigateur !");
      audio.build();
    }

    function loadGame() {
      const s = localStorage.getItem("imperium_v4_3d");
      if (!s) return;
      try {
        const d = JSON.parse(s);
        GameState.money = d.money;
        GameState.totalPop = d.pop;
        ROAD_SEGMENTS.length = 0;
        ROAD_SEGMENTS.push(...d.roads);
        ROAD_NODES.length = 0;
        ROAD_NODES.push(...d.nodes);
        URBAN_BLOCKS.length = 0;
        URBAN_BLOCKS.push(...d.blocks);
        showToast("Progression restaurée !");
      } catch (e) {}
    }

    /* INITIALISATION GLOBALE */
    function init() {
      const canvas = document.getElementById("game-canvas");
      camera = new CameraEngine(canvas);
      canvas.addEventListener("click", handleCanvasClick);

      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => selectCategory(btn.dataset.cat));
      });

      document.getElementById("btn-cancel-placement").addEventListener("click", cancelCurrentTool);
      document.getElementById("btn-zoom-in").addEventListener("click", () => camera.setZoom(camera.targetScale * 1.3));
      document.getElementById("btn-zoom-out").addEventListener("click", () => camera.setZoom(camera.targetScale * 0.7));
      document.getElementById("btn-macro-view").addEventListener("click", () => {
        camera.targetX = 9000; camera.targetY = 6000; camera.targetScale = 0.08;
      });

      document.querySelectorAll(".city-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          camera.targetX = parseInt(btn.dataset.x);
          camera.targetY = parseInt(btn.dataset.y);
          camera.targetScale = 0.85;
          audio.click();
        });
      });

      document.querySelectorAll(".time-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          GameState.speed = parseInt(btn.dataset.speed);
        });
      });

      document.getElementById("btn-save-game").addEventListener("click", saveGame);

      document.getElementById("sound-btn").addEventListener("click", () => {
        audio.muted = !audio.muted;
        showToast(audio.muted ? "Audio coupé" : "Audio activé");
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") cancelCurrentTool();
      });

      selectCategory("infrastructure");
      updateHud();
      loadGame();

      setInterval(simulationTick, 1000);
      requestAnimationFrame(renderGameWorld);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
